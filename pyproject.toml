[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crack-gh-unet"
version = "0.1.0"
description = "A crack segmentation baseline adapted from GH-UNet"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "numpy>=1.24",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["crackseg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

